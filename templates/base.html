<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5c4c">
  <title>{% block title %}Getawly{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <div class="top-bar">
      <a class="brand" href="{% if owner %}/cabinet{% else %}/{% endif %}">Getawly</a>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav id="site-nav" class="site-nav">
      {% if owner %}
        <a href="/cabinet">Кабинет</a>
        <a href="/cabinet/units">Объекты</a>
        <a href="/cabinet/bookings">Заявки</a>
        <a href="/cabinet/bot">Бот</a>
        <a href="/cabinet/subscription">Подписка</a>
        <form class="inline" method="post" action="/logout"><button type="submit" class="btn-ghost">Выйти</button></form>
      {% else %}
        <a href="/login">Войти</a>
        <a class="btn" href="/register">Регистрация</a>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <script>
    (function () {
      var btn = document.getElementById("nav-toggle");
      var nav = document.getElementById("site-nav");
      if (!btn || !nav) return;
      btn.addEventListener("click", function () {
        var open = nav.classList.toggle("is-open");
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      });
    })();
  </script>
</body>
</html>
