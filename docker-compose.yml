name: getawly

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: getawly
      POSTGRES_PASSWORD: getawly
      POSTGRES_DB: getawly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getawly -d getawly"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://getawly:getawly@postgres:5432/getawly
      BASE_URL: ${BASE_URL:-http://localhost:8088}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - api

volumes:
  pgdata:
