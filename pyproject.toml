[project]
name = "getawly"
version = "0.1.0"
description = "Getawly — кабинет хозяина и Telegram-бот для заявок на жильё"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.14.0,<1.15",
    "pydantic-settings>=2.6.0,<2.7",
    "python-multipart>=0.0.17,<0.1",
    "jinja2>=3.1.4,<3.2",
    "passlib[bcrypt]>=1.7.4,<1.8",
    "bcrypt>=4.0.0,<4.1",
    "itsdangerous>=2.2.0,<2.3",
    "httpx>=0.28.0,<0.29",
    "aiogram>=3.15.0,<3.16",
    "python-dotenv>=1.0.1,<1.1",
    "email-validator>=2.2.0,<2.3",
    "psycopg[binary]>=3.2.0,<3.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0,<0.9",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
